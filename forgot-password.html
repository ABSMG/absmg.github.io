<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | OpportunityBridge</title>
  <meta name="description" content="Reset your OpportunityBridge password.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home-link {
      color: white;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b32;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b3d91;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #071f49;
      color: #d3d9e5;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      Opportunity<span>Bridge</span>
    </a>

    <a href="index.html" class="home-link">
      Home
    </a>

  </div>
</header>

<main>

  <div class="auth-box">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your email and we'll send you a password reset link.
    </p>

    <div id="message" class="message"></div>

    <form id="forgotForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >

      <button type="submit" id="resetBtn">
        Send Reset Link
      </button>

    </form>

    <div class="links">
      <a href="login.html">Back to Login</a>
    </div>

  </div>

</main>

<footer>
  © 2026 OpportunityBridge. All rights reserved.
</footer>

<script>
  const SUPABASE_URL =
    "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form =
    document.getElementById("forgotForm");

  const button =
    document.getElementById("resetBtn");

  const message =
    document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    button.disabled = true;
    button.textContent = "Sending...";

    const redirectUrl =
      window.location.origin +
      "/reset-password.html";

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "Send Reset Link";

      return;
    }

    showMessage(
      "If this email is registered, a password reset link has been sent. Please check your inbox and spam folder.",
      "success"
    );

    button.disabled = false;
    button.textContent = "Send Reset Link";

  });
</script>

</body>
</html>
