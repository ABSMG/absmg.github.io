<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | OpportunityBridge</title>
  <meta name="description" content="Reset your OpportunityBridge password.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b4f8a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      color: #0b4f8a;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      color: #123b5d;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6dce5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #0b6fc2;
      box-shadow: 0 0 0 3px rgba(11,111,194,.1);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #0b4f8a;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0b6fc2;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #eaf8ef;
      color: #176b36;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #0b6fc2;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      OpportunityBridge
    </div>

    <h1>Forgot Password?</h1>

    <p class="intro">
      Enter the email address connected to your account
      and we'll send you a password reset link.
    </p>

    <form id="forgotForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
        autocomplete="email"
      >

      <button type="submit" id="resetBtn">
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      ← Back to Login
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://wrdpnhqwolqovoukhlns.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Please enter your email address.",
          "error"
        );
        return;
      }


      resetBtn.disabled = true;
      resetBtn.textContent = "Sending...";


      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://absmg.github.io/reset-password.html"
          }
        );


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";

        return;
      }


      showMessage(
        "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
        "success"
      );


      resetBtn.disabled = false;
      resetBtn.textContent = "Send Reset Link";

    });


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }

  </script>

</body>
</html>
