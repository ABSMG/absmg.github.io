<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | OpportunityBridge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;background:#f1f5f9;
      min-height:100vh;display:flex;align-items:center;
      justify-content:center;padding:20px;
    }
    .box{
      width:100%;max-width:430px;background:white;padding:35px;
      border-radius:18px;box-shadow:0 10px 35px rgba(15,23,42,.10);
    }
    .logo{text-align:center;font-size:25px;font-weight:800;color:#0f766e}
    h1{text-align:center;font-size:27px;margin:15px 0 8px}
    .subtitle{text-align:center;color:#64748b;margin-bottom:25px}
    label{display:block;font-weight:700;margin-bottom:7px}
    input{
      width:100%;padding:14px;border:1px solid #cbd5e1;
      border-radius:9px;font-size:16px;
    }
    button{
      width:100%;padding:14px;margin-top:22px;border:0;
      border-radius:9px;background:#0f766e;color:white;
      font-size:16px;font-weight:700;cursor:pointer;
    }
    button:disabled{opacity:.6}
    .links{text-align:center;margin-top:20px;line-height:2}
    a{color:#0f766e;font-weight:700;text-decoration:none}
    #message{text-align:center;margin-top:15px;font-size:14px}
  </style>
</head>

<body>

<div class="box">

  <div class="logo">OpportunityBridge</div>

  <h1>Reset Password</h1>

  <p class="subtitle">
    Enter your email and we'll send you a password reset link.
  </p>

  <form id="resetForm">

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <button id="resetBtn" type="submit">
      Send Reset Link
    </button>

  </form>

  <div id="message"></div>

  <div class="links">
    <a href="login.html">← Back to Login</a><br>
    <a href="index.html">Back to OpportunityBridge</a>
  </div>

</div>

<script>
const SUPABASE_URL = "https://wrdpnhqwolqovoukhlns.supabase.co";

const SUPABASE_KEY = "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const button = document.getElementById("resetBtn");
  const message = document.getElementById("message");

  button.disabled = true;
  button.textContent = "Sending...";

  const redirectUrl =
    window.location.origin +
    window.location.pathname.replace(
      "forgot-password.html",
      "reset-password.html"
    );

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: redirectUrl
    });

  if (error) {
    message.style.color = "red";
    message.textContent = error.message;
  } else {
    message.style.color = "green";
    message.textContent =
      "If this email exists, a password reset link has been sent.";
  }

  button.disabled = false;
  button.textContent = "Send Reset Link";
});
</script>

</body>
</html>
