<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | OpportunityBridge</title>

  <meta
    name="description"
    content="Reset your OpportunityBridge account password securely."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b1220;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .wrapper {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #087f8c;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f8c;
      box-shadow: 0 0 0 3px rgba(8,127,140,.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #087f8c;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: .92;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #ecfdf3;
      color: #067647;
    }

    .error {
      background: #fef3f2;
      color: #b42318;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #087f8c;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      background: #0b1220;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: auto;
      font-size: 14px;
    }

    footer a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OpportunityBridge</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="wrapper">

  <div class="card">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Create a new password for your OpportunityBridge account.
    </p>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit" id="resetBtn">
        Update Password
      </button>

    </form>

    <div
      id="successMessage"
      class="message success"
    ></div>

    <div
      id="errorMessage"
      class="message error"
    ></div>

    <div class="back">
      <a href="login.html">
        ← Back to Login
      </a>
    </div>

  </div>

</div>

<footer>
  <p>
    © 2026 OpportunityBridge. All rights reserved.
  </p>

  <a href="Privacy.html">
    Privacy Policy
  </a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const form =
    document.getElementById("resetForm");

  const resetBtn =
    document.getElementById("resetBtn");

  const successMessage =
    document.getElementById("successMessage");

  const errorMessage =
    document.getElementById("errorMessage");


  function showSuccess(message) {

    successMessage.textContent = message;

    successMessage.style.display = "block";

    errorMessage.style.display = "none";
  }


  function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

    successMessage.style.display = "none";
  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password.length < 6) {

      showError(
        "Password must contain at least 6 characters."
      );

      return;
    }


    if (password !== confirmPassword) {

      showError(
        "Passwords do not match."
      );

      return;
    }


    resetBtn.disabled = true;

    resetBtn.textContent =
      "Updating Password...";


    try {

      const { data, error } =
        await supabaseClient.auth.updateUser({
          password: password
        });


      if (error) {

        showError(error.message);

        resetBtn.disabled = false;

        resetBtn.textContent =
          "Update Password";

        return;
      }


      showSuccess(
        "Password updated successfully! Redirecting to login..."
      );


      setTimeout(function() {

        window.location.href =
          "login.html";

      }, 2000);


    } catch (error) {

      showError(
        "Something went wrong. Please try again."
      );

      resetBtn.disabled = false;

      resetBtn.textContent =
        "Update Password";
    }

  });


  async function checkRecoverySession() {

    const { data, error } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

      return;
    }


    if (!data.session) {

      showError(
        "This password reset link is invalid or has expired. Please request a new reset link."
      );

      resetBtn.disabled = true;
    }

  }


  supabaseClient.auth.onAuthStateChange(
    function(event, session) {

      if (
        event === "PASSWORD_RECOVERY" &&
        session
      ) {

        resetBtn.disabled = false;

        errorMessage.style.display =
          "none";
      }

    }
  );


  checkRecoverySession();

</script>

</body>
</html>
