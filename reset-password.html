<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | OpportunityBridge</title>
  <meta name="description" content="Create a new OpportunityBridge password.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home-link {
      color: white;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b32;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #0b3d91;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #071f49;
      color: #d3d9e5;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      Opportunity<span>Bridge</span>
    </a>

    <a href="index.html" class="home-link">
      Home
    </a>

  </div>
</header>

<main>

  <div class="auth-box">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Create a new password for your account.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <button type="submit" id="updateBtn">
        Update Password
      </button>

    </form>

    <div class="links">
      <a href="login.html">Back to Login</a>
    </div>

  </div>

</main>

<footer>
  © 2026 OpportunityBridge. All rights reserved.
</footer>

<script>
  const SUPABASE_URL =
    "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form =
    document.getElementById("resetForm");

  const button =
    document.getElementById("updateBtn");

  const message =
    document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }

    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }

    button.disabled = true;
    button.textContent = "Updating...";

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "Update Password";

      return;
    }

    showMessage(
      "Password updated successfully. Redirecting to login...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);

  });
</script>

</body>
</html>
