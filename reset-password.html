<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | OpportunityBridge</title>
  <meta name="description" content="Create a new OpportunityBridge password.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b4f8a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      color: #0b4f8a;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      color: #123b5d;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6dce5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #0b6fc2;
      box-shadow: 0 0 0 3px rgba(11,111,194,.1);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #0b4f8a;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0b6fc2;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #eaf8ef;
      color: #176b36;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #0b6fc2;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .requirements {
      background: #f7f9fc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      OpportunityBridge
    </div>

    <h1>Reset Password</h1>

    <p class="intro">
      Create a new password for your OpportunityBridge account.
    </p>

    <div class="requirements">
      Use a strong password that you can remember.
    </div>

    <form id="resetForm">

      <label for="password">New Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <button type="submit" id="updateBtn">
        Update Password
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      ← Back to Login
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://wrdpnhqwolqovoukhlns.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const form =
      document.getElementById("resetForm");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const updateBtn =
      document.getElementById("updateBtn");

    const message =
      document.getElementById("message");


    let recoverySession = false;


    // Detect the password-recovery session

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (event === "PASSWORD_RECOVERY" && session) {

          recoverySession = true;

          showMessage(
            "You can now create your new password.",
            "success"
          );

        }

      }
    );


    // Also check the current session

    async function checkRecoverySession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {
        recoverySession = true;
      }

    }


    checkRecoverySession();


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const newPassword =
          password.value;

        const confirm =
          confirmPassword.value;


        if (newPassword.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        if (newPassword !== confirm) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        updateBtn.disabled = true;
        updateBtn.textContent =
          "Updating...";


        const { error } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          updateBtn.disabled = false;
          updateBtn.textContent =
            "Update Password";

          return;
        }


        showMessage(
          "Password updated successfully! Redirecting to login...",
          "success"
        );


        await supabaseClient.auth.signOut();


        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 1800);

      }
    );


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";
    }

  </script>

</body>
</html>
