<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | OpportunityBridge</title>

  <meta name="description" content="Create your OpportunityBridge account and discover scholarships, jobs, internships and online courses.">

  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#0b4f8a">

  <link rel="canonical" href="https://absmg.github.io/register.html">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef6ff, #f7f9fc);
      color: #172033;
    }

    /* HEADER */

    header {
      background: #0b4f8a;
      color: white;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    .nav-container {
      max-width: 1150px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: 700;
    }

    .back-home {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-home:hover {
      opacity: 0.8;
    }

    /* REGISTER AREA */

    .register-wrapper {
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .register-card {
      width: 100%;
      max-width: 470px;
      background: white;
      border-radius: 18px;
      padding: 38px 35px;
      box-shadow: 0 15px 45px rgba(11,79,138,0.12);
      border: 1px solid #e7edf5;
    }

    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .register-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #eaf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .register-header h1 {
      font-size: 29px;
      margin-bottom: 8px;
      color: #102a43;
    }

    .register-header p {
      color: #6b7280;
      font-size: 14px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #26364a;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5dce5;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      background: #fff;
      transition: 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #0b6fc2;
      box-shadow: 0 0 0 3px rgba(11,111,194,0.1);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      color: #667085;
    }

    /* TERMS */

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 18px 0;
      font-size: 13px;
      color: #667085;
    }

    .terms input {
      margin-top: 3px;
    }

    .terms a {
      color: #0b5fa5;
      text-decoration: none;
      font-weight: 600;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    /* BUTTON */

    .register-btn {
      width: 100%;
      border: none;
      background: #0b4f8a;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .register-btn:hover {
      background: #0b6fc2;
      transform: translateY(-1px);
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff1f2;
      color: #b42318;
    }

    /* LOGIN */

    .login-link {
      text-align: center;
      margin-top: 23px;
      padding-top: 20px;
      border-top: 1px solid #edf0f4;
      color: #667085;
      font-size: 14px;
    }

    .login-link a {
      color: #0b4f8a;
      text-decoration: none;
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px;
      color: #7a8699;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      .nav-container {
        padding: 15px;
      }

      .logo {
        font-size: 20px;
      }

      .register-wrapper {
        padding: 25px 15px;
      }

      .register-card {
        padding: 30px 22px;
        border-radius: 15px;
      }

      .register-header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="nav-container">

      <a href="index.html" class="logo">
        OpportunityBridge
      </a>

      <a href="index.html" class="back-home">
        ← Home
      </a>

    </div>
  </header>


  <!-- REGISTER -->

  <main class="register-wrapper">

    <div class="register-card">

      <div class="register-header">

        <div class="register-icon">
          👤
        </div>

        <h1>Create Your Account</h1>

        <p>
          Join OpportunityBridge and discover opportunities for your future.
        </p>

      </div>


      <form id="registerForm">

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <div class="input-wrapper">

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('password', this)"
              aria-label="Show password">
              👁
            </button>

          </div>

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('confirmPassword', this)"
              aria-label="Show password">
              👁
            </button>

          </div>

        </div>


        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the
            <a href="Privacy.html">
              Privacy Policy
            </a>
            and
            <a href="Disclaimer.html">
              Disclaimer
            </a>.
          </label>

        </div>


        <button
          type="submit"
          class="register-btn">
          Create Account
        </button>


        <div id="message" class="message"></div>

      </form>


      <div class="login-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>

  </main>


  <footer>
    © 2026 OpportunityBridge. All rights reserved.
  </footer>


  <script>

    function togglePassword(inputId, button) {

      const input = document.getElementById(inputId);

      if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

      } else {

        input.type = "password";
        button.textContent = "👁";

      }

    }


    document.getElementById("registerForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const terms =
        document.getElementById("terms").checked;

      const message =
        document.getElementById("message");


      message.className = "message";
      message.textContent = "";


      if (password.length < 8) {

        message.className = "message error";
        message.textContent =
          "Password must contain at least 8 characters.";

        return;

      }


      if (password !== confirmPassword) {

        message.className = "message error";
        message.textContent =
          "Passwords do not match.";

        return;

      }


      if (!terms) {

        message.className = "message error";
        message.textContent =
          "Please accept the Privacy Policy and Disclaimer.";

        return;

      }


      /*
        Registration backend will be connected here.

        Do NOT store real passwords in localStorage
        or directly inside this HTML file.
      */

      alert(
        "Registration form is ready. Backend authentication needs to be connected."
      );

    });

  </script>

</body>
</html>
