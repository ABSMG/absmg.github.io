<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | OpportunityBridge</title>
  <meta name="description" content="Create your OpportunityBridge account and discover scholarships, jobs, internships and online courses.">
  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      color: #0b4f8a;
      font-size: 30px;
      margin-bottom: 6px;
    }

    .brand p {
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: .2s;
    }

    input:focus {
      border-color: #0b6fc2;
      box-shadow: 0 0 0 3px rgba(11,111,194,.1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #0b6fc2;
      font-weight: 600;
      cursor: pointer;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 18px 0;
      font-size: 13px;
      color: #667085;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #0b6fc2;
      text-decoration: none;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #0b4f8a;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      background: #083b68;
    }

    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff1f0;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #667085;
    }

    .login-link a {
      color: #0b6fc2;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      text-align: center;
      margin-top: 18px;
    }

    .back a {
      color: #667085;
      font-size: 13px;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 23px 19px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>OpportunityBridge</h1>
      <p>Find opportunities. Move forward.</p>
    </div>

    <div class="card">

      <h2>Create your account</h2>
      <p class="subtitle">
        Join OpportunityBridge to explore scholarships, jobs, internships and online courses.
      </p>

      <div id="message" class="message"></div>

      <form id="registerForm">

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-btn"
              onclick="togglePassword('password', this)"
            >
              Show
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-box">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="show-btn"
              onclick="togglePassword('confirmPassword', this)"
            >
              Show
            </button>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>

          <span>
            I agree to the
            <a href="Privacy.html">Privacy Policy</a>
            and
            <a href="Disclaimer.html">Disclaimer</a>.
          </span>
        </label>

        <button type="submit" class="btn" id="registerBtn">
          Create Account
        </button>

      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <div class="back">
        <a href="index.html">← Back to OpportunityBridge</a>
      </div>

    </div>
  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://wrdpnhqwolqovoukhlns.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    function togglePassword(id, button) {

      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
      } else {
        input.type = "password";
        button.textContent = "Show";
      }
    }


    function showMessage(text, type) {

      const message = document.getElementById("message");

      message.textContent = text;
      message.className = "message " + type;
    }


    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const fullName =
          document.getElementById("fullName").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const registerBtn =
          document.getElementById("registerBtn");


        if (fullName.length < 2) {

          showMessage(
            "Please enter your full name.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        registerBtn.disabled = true;
        registerBtn.textContent = "Creating account...";


        try {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: fullName
                },

                emailRedirectTo:
                  "https://absmg.github.io/login.html"
              }

            });


          if (error) {
            throw error;
          }


          if (data.session) {

            showMessage(
              "Account created successfully! Redirecting...",
              "success"
            );

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1200);

          } else {

            showMessage(
              "Account created! Please check your email and verify your account before logging in.",
              "success"
            );

            document
              .getElementById("registerForm")
              .reset();

          }


        } catch (error) {

          console.error(error);

          showMessage(
            error.message || "Registration failed. Please try again.",
            "error"
          );

        } finally {

          registerBtn.disabled = false;
          registerBtn.textContent = "Create Account";

        }

      });

  </script>

</body>
</html>
