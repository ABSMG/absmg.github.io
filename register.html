<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | OpportunityBridge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{
      min-height:100vh;
      background:linear-gradient(135deg,#071a33,#0b4f8a);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px
    }
    .box{
      width:100%;
      max-width:430px;
      background:#fff;
      padding:35px 28px;
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,.25)
    }
    .logo{
      text-align:center;
      font-size:28px;
      font-weight:800;
      color:#0b4f8a;
      margin-bottom:8px
    }
    .sub{
      text-align:center;
      color:#64748b;
      margin-bottom:25px
    }
    label{
      display:block;
      margin:14px 0 7px;
      font-weight:600;
      color:#172033
    }
    input{
      width:100%;
      padding:14px;
      border:1px solid #d5dce5;
      border-radius:10px;
      font-size:15px;
      outline:none
    }
    input:focus{
      border-color:#1479d1;
      box-shadow:0 0 0 3px rgba(20,121,209,.12)
    }
    button{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:linear-gradient(135deg,#0866b3,#1595ed);
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer
    }
    button:disabled{opacity:.6}
    #message{
      text-align:center;
      margin-top:16px;
      font-size:14px
    }
    .login{
      text-align:center;
      margin-top:22px;
      color:#64748b
    }
    .login a{
      color:#0866b3;
      font-weight:700;
      text-decoration:none
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">OpportunityBridge</div>

  <p class="sub">Create your account</p>

  <form id="registerForm">

    <label>Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="6"
      required
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      minlength="6"
      required
    >

    <button type="submit" id="registerBtn">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://wrdpnhqwolqovoukhlns.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const form = document.getElementById("registerForm");
const button = document.getElementById("registerBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.style.color = "#dc2626";
    message.textContent = "Passwords do not match.";
    return;
  }

  button.disabled = true;
  button.textContent = "Creating account...";
  message.textContent = "";

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: name
        }
      }
    });

  if (error) {

    message.style.color = "#dc2626";
    message.textContent = error.message;

    button.disabled = false;
    button.textContent = "Create Account";

    return;
  }

  message.style.color = "#16a34a";
  message.textContent =
    "Account created successfully!";

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1000);

});
</script>

</body>
</html>
