<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | OpportunityBridge</title>
  <meta name="description" content="Login to your OpportunityBridge account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      color: white;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home-link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .input-group {
      position: relative;
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
      box-shadow: 0 0 0 2px rgba(11,61,145,0.08);
    }

    .password-input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 6px 8px;
      background: transparent;
      color: #0b3d91;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b32;
    }

    .info {
      display: block;
      background: #eaf2ff;
      color: #174b91;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b3d91;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #071f49;
      color: #d3d9e5;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .auth-box {
        padding: 27px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      Opportunity<span>Bridge</span>
    </a>

    <a href="index.html" class="home-link">
      Home
    </a>

  </div>
</header>


<main>

  <div class="auth-box">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your OpportunityBridge account.
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <div class="input-group">

        <input
          type="password"
          id="password"
          class="password-input"
          placeholder="Enter your password"
          required
          minlength="6"
          autocomplete="current-password"
        >

        <button
          type="button"
          id="togglePassword"
          class="toggle-password"
        >
          Show
        </button>

      </div>

      <button
        type="submit"
        id="loginBtn"
        class="login-btn"
      >
        Login
      </button>

    </form>

    <div class="links">

      <div>
        <a href="forgot-password.html">
          Forgot your password?
        </a>
      </div>

      <div>
        Don't have an account?
        <a href="register.html">
          Create an account
        </a>
      </div>

    </div>

  </div>

</main>


<footer>
  © 2026 OpportunityBridge. All rights reserved.
</footer>


<script>
  /*
   * ==========================================
   * OPPORTUNITYBRIDGE SUPABASE CONFIGURATION
   * ==========================================
   */

  const SUPABASE_URL =
    "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGGgJRuBg_QK7Srf_b";


  /*
   * ==========================================
   * CHECK SUPABASE LIBRARY
   * ==========================================
   */

  const messageBox =
    document.getElementById("message");

  const loginButton =
    document.getElementById("loginBtn");

  const passwordInput =
    document.getElementById("password");

  const togglePassword =
    document.getElementById("togglePassword");


  function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className =
      "message " + type;
  }


  function hideMessage() {

    messageBox.textContent = "";

    messageBox.className =
      "message";
  }


  /*
   * ==========================================
   * MAKE SURE SUPABASE LIBRARY EXISTS
   * ==========================================
   */

  if (!window.supabase) {

    showMessage(
      "Supabase library failed to load. Please check your internet connection and refresh the page.",
      "error"
    );

    throw new Error(
      "Supabase JavaScript library failed to load."
    );
  }


  /*
   * ==========================================
   * CREATE SUPABASE CLIENT
   * ==========================================
   */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  /*
   * ==========================================
   * SHOW / HIDE PASSWORD
   * ==========================================
   */

  togglePassword.addEventListener(
    "click",
    function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";

        togglePassword.textContent = "Show";

      }

    }
  );


  /*
   * ==========================================
   * TEST SUPABASE CONNECTION
   * ==========================================
   */

  async function testSupabaseConnection() {

    try {

      const response =
        await fetch(
          SUPABASE_URL + "/auth/v1/settings",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            },
            cache: "no-store"
          }
        );


      const text =
        await response.text();


      console.log(
        "Supabase API test:",
        {
          status: response.status,
          ok: response.ok,
          body: text
        }
      );


      if (!response.ok) {

        return {
          ok: false,
          status: response.status,
          body: text
        };

      }


      return {
        ok: true,
        status: response.status,
        body: text
      };

    } catch (error) {

      console.error(
        "Supabase connection test failed:",
        error
      );

      return {
        ok: false,
        status: 0,
        body: error.message
      };
    }
  }


  /*
   * ==========================================
   * LOGIN
   * ==========================================
   */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideMessage();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          passwordInput.value;


        /*
         * BASIC VALIDATION
         */

        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;
        }


        if (!password) {

          showMessage(
            "Please enter your password.",
            "error"
          );

          return;
        }


        /*
         * START LOADING
         */

        loginButton.disabled = true;

        loginButton.textContent =
          "Checking connection...";


        try {

          /*
           * ========================================
           * FIRST: TEST SUPABASE API
           * ========================================
           */

          const apiTest =
            await testSupabaseConnection();


          console.log(
            "Supabase API result:",
            apiTest
          );


          if (!apiTest.ok) {

            showMessage(
              "Supabase API error. HTTP " +
              apiTest.status +
              ". Details: " +
              apiTest.body,
              "error"
            );

            loginButton.disabled = false;

            loginButton.textContent = "Login";

            return;
          }


          /*
           * ========================================
           * SECOND: LOGIN
           * ========================================
           */

          loginButton.textContent =
            "Logging in...";


          console.log(
            "Attempting login for:",
            email
          );


          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          console.log(
            "Supabase login response:",
            {
              user: data?.user || null,
              session: !!data?.session,
              error: error || null
            }
          );


          /*
           * ========================================
           * HANDLE LOGIN ERROR
           * ========================================
           */

          if (error) {

            console.error(
              "SUPABASE LOGIN ERROR:",
              error
            );


            let detailedError =
              error.message ||
              "Login failed.";


            /*
             * DO NOT HIDE THE REAL ERROR.
             */

            if (
              error.status
            ) {

              detailedError +=
                " (HTTP " +
                error.status +
                ")";

            }


            if (
              error.code
            ) {

              detailedError +=
                " Code: " +
                error.code;

            }


            showMessage(
              detailedError,
              "error"
            );


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login";

            return;
          }


          /*
           * ========================================
           * MAKE SURE SESSION EXISTS
           * ========================================
           */

          if (
            !data ||
            !data.user ||
            !data.session
          ) {

            showMessage(
              "Login completed but no active session was returned. Please try again.",
              "error"
            );


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login";

            return;
          }


          /*
           * ========================================
           * LOGIN SUCCESS
           * ========================================
           */

          console.log(
            "LOGIN SUCCESS",
            data.user
          );


          showMessage(
            "Login successful. Opening your dashboard...",
            "success"
          );


          /*
           * Give Supabase a moment to persist
           * the session before redirecting.
           */

          setTimeout(
            function() {

              window.location.replace(
                "dashboard.html"
              );

            },
            700
          );

        } catch (error) {

          console.error(
            "UNEXPECTED LOGIN ERROR:",
            error
          );


          let message =
            error?.message ||
            "Unexpected login error.";


          if (
            error?.status
          ) {

            message +=
              " (HTTP " +
              error.status +
              ")";

          }


          showMessage(
            message,
            "error"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";
        }

      }
    );
</script>

</body>
</html>
