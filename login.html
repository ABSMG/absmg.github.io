<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | OpportunityBridge</title>
  <meta name="description" content="Login to your OpportunityBridge account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      color: white;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home-link {
      color: white;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      margin-bottom: 17px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b32;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b3d91;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #071f49;
      color: #d3d9e5;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <a href="index.html" class="logo">
        Opportunity<span>Bridge</span>
      </a>

      <a href="index.html" class="home-link">
        Home
      </a>

    </div>
  </header>

  <main>
    <div class="auth-box">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your OpportunityBridge account.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        >

        <button type="submit" id="loginBtn">
          Login
        </button>

      </form>

      <div class="links">

        <div>
          <a href="forgot-password.html">
            Forgot your password?
          </a>
        </div>

        <div>
          Don't have an account?
          <a href="register.html">
            Create an account
          </a>
        </div>

      </div>

    </div>
  </main>

  <footer>
    © 2026 OpportunityBridge. All rights reserved.
  </footer>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://wrdpnhqwolqovoukhlns.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lwbqDRIFpr9-n0DGGgJRuBg_QK7Srf_b";


    // ==========================================
    // CREATE SUPABASE CLIENT
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginBtn");

    const messageBox =
      document.getElementById("message");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;
    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        // Disable button
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";


        try {

          const result =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          const data = result.data;
          const error = result.error;


          // ==========================================
          // LOGIN ERROR
          // ==========================================

          if (error) {

            console.error(
              "Supabase Login Error:",
              error
            );

            showMessage(
              error.message,
              "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Login";

            return;
          }


          // ==========================================
          // CHECK USER
          // ==========================================

          if (!data || !data.user) {

            showMessage(
              "Login failed. Please try again.",
              "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Login";

            return;
          }


          // ==========================================
          // SUCCESS
          // ==========================================

          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          // Give Supabase time to save the session
          setTimeout(function () {

            window.location.replace(
              "dashboard.html"
            );

          }, 700);


        } catch (error) {

          console.error(
            "Unexpected Login Error:",
            error
          );

          showMessage(
            "Unable to login right now. Please try again.",
            "error"
          );

          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }

      }
    );
  </script>

</body>
</html>
