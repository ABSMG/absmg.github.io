<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | OpportunityBridge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd2dc;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .show-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #0b3d91;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #0b3d91;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e8f7ed;
      color: #176b35;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b3d91;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      background: #071f49;
      color: #dce3ef;
      text-align: center;
      padding: 18px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      Opportunity<span>Bridge</span>
    </a>

    <a href="index.html" class="home">
      Home
    </a>

  </div>
</header>

<main>

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your OpportunityBridge account.
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>

      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="showPassword"
            class="show-btn"
          >
            Show
          </button>

        </div>

      </div>

      <button
        type="submit"
        id="loginBtn"
        class="login-btn"
      >
        Login
      </button>

    </form>

    <div class="links">

      <div>
        <a href="forgot-password.html">
          Forgot your password?
        </a>
      </div>

      <div>
        Don't have an account?
        <a href="register.html">
          Create an account
        </a>
      </div>

    </div>

  </div>

</main>

<footer>
  © 2026 OpportunityBridge. All rights reserved.
</footer>

<script>

  const SUPABASE_URL =
    "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGGgJRuBg_QK7Srf_b";


  /* ==============================
     CHECK SUPABASE LIBRARY
     ============================== */

  if (!window.supabase) {

    document.getElementById("message").textContent =
      "Supabase library failed to load. Please refresh the page.";

    document.getElementById("message").className =
      "message error";

    throw new Error("Supabase library failed to load.");

  }


  /* ==============================
     CREATE CLIENT
     ============================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


  /* ==============================
     ELEMENTS
     ============================== */

  const form =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const showPassword =
    document.getElementById("showPassword");


  /* ==============================
     MESSAGE
     ============================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* ==============================
     SHOW / HIDE PASSWORD
     ============================== */

  showPassword.addEventListener(
    "click",
    function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        showPassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";

        showPassword.textContent = "Show";

      }

    }
  );


  /* ==============================
     LOGIN
     ============================== */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        const data = result.data;

        const error = result.error;


        if (error) {

          console.error(
            "Supabase login error:",
            error
          );

          showMessage(
            error.message ||
            "Login failed. Please check your email and password.",
            "error"
          );

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

          return;

        }


        if (
          !data ||
          !data.user ||
          !data.session
        ) {

          showMessage(
            "Login succeeded but no active session was created.",
            "error"
          );

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

          return;

        }


        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );


        setTimeout(
          function () {

            window.location.href =
              "dashboard.html";

          },
          700
        );

      }

      catch (error) {

        console.error(
          "Unexpected login error:",
          error
        );

        showMessage(
          error.message ||
          "An unexpected error occurred. Please try again.",
          "error"
        );

        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }

    }
  );

</script>

</body>
</html>
