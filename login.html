<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OpportunityBridge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #123b63;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #123b63;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #c62828;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>OpportunityBridge</h2>

  <input
    type="email"
    id="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="loginUser()">
    Login
  </button>

  <div id="message"></div>

  <a href="forgot-password.html">Forgot password?</a>
  <a href="register.html">Create an account</a>
</div>

<script>
const SUPABASE_URL =
  "https://wrdpnhqwolqovoukhlns.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

async function loginUser() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginBtn");

  message.textContent = "";

  if (!email || !password) {
    message.textContent =
      "Please enter your email and password.";
    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      console.error("SUPABASE LOGIN ERROR:", error);

      message.textContent =
        error.message;

      button.disabled = false;
      button.textContent = "Login";
      return;
    }

    if (data && data.session) {
      window.location.href =
        "dashboard.html";
      return;
    }

    message.textContent =
      "Login failed. No session was created.";

  } catch (err) {

    console.error("LOGIN EXCEPTION:", err);

    message.textContent =
      "Unable to connect to Supabase.";

  } finally {

    button.disabled = false;
    button.textContent = "Login";
  }
}
</script>

</body>
</html>
