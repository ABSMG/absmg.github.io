<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | OpportunityBridge</title>
  <meta name="description" content="Login to your OpportunityBridge account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b3d91;
      color: white;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd54a;
    }

    .home-link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .auth-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #0b3d91;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .input-group {
      position: relative;
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d91;
      box-shadow: 0 0 0 2px rgba(11, 61, 145, 0.08);
    }

    .password-input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 6px 8px;
      background: transparent;
      color: #0b3d91;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: transparent;
      opacity: 0.8;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.93;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #a40000;
    }

    .success {
      display: block;
      background: #e9f8ee;
      color: #176b32;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b3d91;
      text-decoration: none;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #071f49;
      color: #d3d9e5;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .auth-box {
        padding: 27px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <a href="index.html" class="logo">
        Opportunity<span>Bridge</span>
      </a>

      <a href="index.html" class="home-link">
        Home
      </a>

    </div>
  </header>

  <main>

    <div class="auth-box">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your OpportunityBridge account.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        >

        <label for="password">
          Password
        </label>

        <div class="input-group">

          <input
            type="password"
            id="password"
            class="password-input"
            placeholder="Enter your password"
            required
            minlength="6"
            autocomplete="current-password"
          >

          <button
            type="button"
            id="togglePassword"
            class="toggle-password"
          >
            Show
          </button>

        </div>

        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          Login
        </button>

      </form>

      <div class="links">

        <div>
          <a href="forgot-password.html">
            Forgot your password?
          </a>
        </div>

        <div>
          Don't have an account?
          <a href="register.html">
            Create an account
          </a>
        </div>

      </div>

    </div>

  </main>

  <footer>
    © 2026 OpportunityBridge. All rights reserved.
  </footer>


  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://wrdpnhqwolqovoukhlns.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lwbqDRIFpr9-n0DGGgJRuBg_QK7Srf_b";


    // ==========================================
    // CHECK SUPABASE LIBRARY
    // ==========================================

    if (!window.supabase) {

      console.error("Supabase library failed to load.");

    }


    // ==========================================
    // CREATE SUPABASE CLIENT
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginBtn");

    const messageBox =
      document.getElementById("message");

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;
    }


    // ==========================================
    // HIDE MESSAGE
    // ==========================================

    function hideMessage() {

      messageBox.textContent = "";

      messageBox.className =
        "message";
    }


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    togglePassword.addEventListener(
      "click",
      function () {

        if (passwordInput.type === "password") {

          passwordInput.type = "text";

          togglePassword.textContent = "Hide";

        } else {

          passwordInput.type = "password";

          togglePassword.textContent = "Show";

        }

      }
    );


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        hideMessage();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          passwordInput.value;


        // ==========================================
        // BASIC VALIDATION
        // ==========================================

        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;
        }


        if (!password) {

          showMessage(
            "Please enter your password.",
            "error"
          );

          return;
        }


        // ==========================================
        // LOADING
        // ==========================================

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          console.log(
            "Attempting Supabase login..."
          );


          // ==========================================
          // SUPABASE LOGIN
          // ==========================================

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          console.log(
            "Login response:",
            {
              hasUser: !!data?.user,
              hasSession: !!data?.session,
              error: error?.message || null
            }
          );


          // ==========================================
          // HANDLE ERROR
          // ==========================================

          if (error) {

            console.error(
              "Supabase Login Error:",
              error
            );


            let errorMessage =
              error.message ||
              "Login failed. Please try again.";


            if (
              errorMessage
                .toLowerCase()
                .includes("invalid api key")
            ) {

              errorMessage =
                "Invalid API Key. Please refresh the page and try again. If the problem continues, the live login.html may still be using an old configuration.";

            }


            showMessage(
              errorMessage,
              "error"
            );


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login";

            return;
          }


          // ==========================================
          // CHECK USER
          // ==========================================

          if (!data || !data.user) {

            showMessage(
              "Login failed. No user session was returned.",
              "error"
            );

            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login";

            return;
          }


          // ==========================================
          // SUCCESS
          // ==========================================

          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          // ==========================================
          // REDIRECT
          // ==========================================

          setTimeout(
            function () {

              window.location.replace(
                "dashboard.html"
              );

            },
            500
          );

        } catch (error) {

          console.error(
            "Unexpected Login Error:",
            error
          );


          showMessage(
            "Unable to login right now. Please check your internet connection and try again.",
            "error"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";

        }

      }
    );
  </script>

</body>
</html>
