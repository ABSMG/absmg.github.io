<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | OpportunityBridge</title>
  <meta name="description" content="Login to your OpportunityBridge account.">
  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      color: #0b4f8a;
      font-size: 30px;
      margin-bottom: 6px;
    }

    .brand p {
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0b6fc2;
      box-shadow: 0 0 0 3px rgba(11,111,194,.1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 70px;
    }

    .show-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #0b6fc2;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -7px;
      margin-bottom: 20px;
      color: #0b6fc2;
      text-decoration: none;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0b4f8a;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      background: #083b68;
    }

    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff1f0;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #667085;
      font-size: 14px;
    }

    .register a {
      color: #0b6fc2;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      text-align: center;
      margin-top: 18px;
    }

    .back a {
      color: #667085;
      font-size: 13px;
      text-decoration: none;
    }

    @media(max-width:480px) {
      .card {
        padding: 23px 19px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <h1>OpportunityBridge</h1>
    <p>Find opportunities. Move forward.</p>
  </div>

  <div class="card">

    <h2>Welcome back</h2>

    <p class="subtitle">
      Login to access your OpportunityBridge account.
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">

        <label for="password">Password</label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword()"
          >
            Show
          </button>

        </div>

      </div>

      <a href="forgot-password.html" class="forgot">
        Forgot password?
      </a>

      <button
        type="submit"
        class="btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="back">
      <a href="index.html">← Back to OpportunityBridge</a>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://wrdpnhqwolqovoukhlns.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

const { createClient } = supabase;

const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


function togglePassword() {

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-btn");

  if (password.type === "password") {

    password.type = "text";
    button.textContent = "Hide";

  } else {

    password.type = "password";
    button.textContent = "Show";

  }
}


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;
  message.className = "message " + type;
}


document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;

    const loginBtn =
      document.getElementById("loginBtn");


    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {
        throw error;
      }


      showMessage(
        "Login successful! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 800);


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Login failed. Check your email and password.",
        "error"
      );

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

    }

  });

</script>

</body>
</html>
