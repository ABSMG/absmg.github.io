<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OpportunityBridge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071a33, #0b4f8a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #0b4f8a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1479d1;
      box-shadow: 0 0 0 3px rgba(20,121,209,.12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0866b3, #1595ed);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
    }

    .register a {
      color: #0866b3;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">OpportunityBridge</div>

    <p class="subtitle">Login to your account</p>

    <form id="loginForm">

      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginBtn">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <a href="index.html" class="back">← Back to website</a>

  </div>

<script>
  const SUPABASE_URL = "https://wrdpnhqwolqovoukhlns.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lwbqDRIFpr9-n0DGgJRuBg_QK7Srf_b";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginBtn");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      message.style.color = "#dc2626";
      message.textContent =
        "Login failed. Please check your email and password.";

      button.disabled = false;
      button.textContent = "Login";

      return;
    }

    message.style.color = "#16a34a";
    message.textContent = "Login successful!";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 700);

  });
</script>

</body>
</html>
