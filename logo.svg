<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024">

  <defs>

    <!-- GOLD -->
    <linearGradient id="gold"
      x1="180" y1="150"
      x2="850" y2="700"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4A8"/>
      <stop offset="25%" stop-color="#FFD84A"/>
      <stop offset="55%" stop-color="#F4C542"/>
      <stop offset="80%" stop-color="#DDAA20"/>
      <stop offset="100%" stop-color="#B77B08"/>
    </linearGradient>

    <!-- PREMIUM BLUE -->
    <linearGradient id="blue"
      x1="350" y1="600"
      x2="670" y2="430"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#063B9C"/>
      <stop offset="35%" stop-color="#0967E8"/>
      <stop offset="70%" stop-color="#168CFF"/>
      <stop offset="100%" stop-color="#67C7FF"/>
    </linearGradient>

    <!-- WHITE -->
    <linearGradient id="white"
      x1="300" y1="500"
      x2="700" y2="800"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3F7FF"/>
      <stop offset="100%" stop-color="#B8C9E5"/>
    </linearGradient>

  </defs>


  <!-- ================================= -->
  <!-- GOLDEN BRIDGE OUTER ARCH -->
  <!-- ================================= -->

  <path
    d="M145 650
       C185 350 350 165 512 165
       C674 165 839 350 879 650"
    fill="none"
    stroke="#8E6200"
    stroke-width="108"
    stroke-linecap="round"
    opacity="0.25"/>

  <path
    d="M145 650
       C185 350 350 165 512 165
       C674 165 839 350 879 650"
    fill="none"
    stroke="url(#gold)"
    stroke-width="82"
    stroke-linecap="round"/>


  <!-- GOLD INNER HIGHLIGHT -->

  <path
    d="M177 640
       C220 385 365 215 512 215
       C659 215 804 385 847 640"
    fill="none"
    stroke="#FFF1A0"
    stroke-width="9"
    stroke-linecap="round"
    opacity="0.9"/>


  <!-- ================================= -->
  <!-- LEFT WHITE SUPPORT -->
  <!-- ================================= -->

  <rect
    x="225"
    y="505"
    width="78"
    height="235"
    rx="20"
    fill="#8EA4C7"
    opacity="0.35"/>

  <rect
    x="235"
    y="495"
    width="68"
    height="245"
    rx="18"
    fill="url(#white)"/>

  <rect
    x="250"
    y="515"
    width="15"
    height="190"
    rx="7"
    fill="#FFFFFF"/>


  <!-- ================================= -->
  <!-- RIGHT WHITE SUPPORT -->
  <!-- ================================= -->

  <rect
    x="721"
    y="505"
    width="78"
    height="235"
    rx="20"
    fill="#8EA4C7"
    opacity="0.35"/>

  <rect
    x="721"
    y="495"
    width="68"
    height="245"
    rx="18"
    fill="url(#white)"/>

  <rect
    x="739"
    y="515"
    width="15"
    height="190"
    rx="7"
    fill="#FFFFFF"/>


  <!-- ================================= -->
  <!-- BLUE CONNECTION ARCH -->
  <!-- ================================= -->

  <path
    d="M350 610
       C395 525 450 465 512 465
       C574 465 629 525 674 610"
    fill="none"
    stroke="#062E73"
    stroke-width="82"
    stroke-linecap="round"
