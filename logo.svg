  <circle
    cx="145"
    cy="650"
    r="16"
    fill="#FFD84A"/>

  <circle
    cx="879"
    cy="650"
    r="16"
    fill="#FFD84A"/>

  <circle
    cx="512"
    cy="165"
    r="14"
    fill="#FFF4A8"/>

</svg>
