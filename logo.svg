<!-- PREMIUM BLUE CONNECTION -->

<defs>
  <linearGradient id="premiumBlue"
                  x1="350" y1="620"
                  x2="680" y2="430"
                  gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#063B9C"/>
    <stop offset="0.35" stop-color="#0B5FE7"/>
    <stop offset="0.65" stop-color="#1688FF"/>
    <stop offset="1" stop-color="#67C7FF"/>
  </linearGradient>

  <linearGradient id="blueHighlight"
                  x1="390" y1="570"
                  x2="630" y2="480"
                  gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
  </linearGradient>

  <filter id="premiumBlueGlow"
          x="-40%" y="-40%"
          width="180%" height="180%">
    <feGaussianBlur stdDeviation="13" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Outer blue glow -->
<path
  d="M365 600
     C410 520 455 470 512 470
     C569 470 614 520 659 600"
  stroke="#1688FF"
  stroke-width="82"
  stroke-linecap="round"
  opacity="0.20"
  filter="url(#premiumBlueGlow)"
/>

<!-- Main premium blue connection -->
<path
  d="M365 600
     C410 520 455 470 512 470
     C569 470 614 520 659 600"
  stroke="url(#premiumBlue)"
  stroke-width="58"
  stroke-linecap="round"
/>

<!-- Blue glass highlight -->
<path
  d="M388 580
     C430 515 470 485 512 485
     C554 485 594 515 636 580"
  stroke="url(#blueHighlight)"
  stroke-width="9"
  stroke-linecap="round"
  opacity="0.85"
/>

<!-- Premium center -->
<circle
  cx="512"
  cy="470"
  r="34"
  fill="#0B5FE7"
  opacity="0.35"
  filter="url(#premiumBlueGlow)"
/>

<circle
  cx="512"
  cy="470"
  r="27"
  fill="url(#premiumBlue)"
/>

<circle
  cx="512"
  cy="470"
  r="10"
  fill="#FFFFFF"
  opacity="0.95"
/>
