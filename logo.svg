<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     fill="none">

  <!-- TRANSPARENT BACKGROUND -->

  <defs>
    <!-- Gold -->
    <linearGradient id="gold" x1="180" y1="150" x2="850" y2="850"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3A3"/>
      <stop offset="0.22" stop-color="#FFD84D"/>
      <stop offset="0.55" stop-color="#F4C542"/>
      <stop offset="0.8" stop-color="#DDAA19"/>
      <stop offset="1" stop-color="#B98208"/>
    </linearGradient>

    <!-- Blue -->
    <linearGradient id="blue" x1="300" y1="300" x2="700" y2="700"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2388FF"/>
      <stop offset="0.5" stop-color="#1769D1"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>

    <!-- White metallic effect -->
    <linearGradient id="whiteMetal" x1="300" y1="500" x2="700" y2="850"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#B9C9E5"/>
    </linearGradient>

    <!-- Gold glow -->
    <filter id="goldGlow"
            x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blue glow -->
    <filter id="blueGlow"
            x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow"
            x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14"
                    stdDeviation="14"
                    flood-color="#062B68"
                    flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ========================= -->
  <!-- GOLD BRIDGE MAIN ARCH -->
  <!-- ========================= -->

  <path
    d="M150 650
       C190 350 350 180 512 180
       C674 180 834 350 874 650"
    stroke="#0B3D91"
    stroke-width="105"
    stroke-linecap="round"
    opacity="0.18"/>

  <path
    d="M150 650
       C190 350 350 180 512 180
       C674 180 834 350 874 650"
    stroke="url(#gold)"
    stroke-width="82"
    stroke-linecap="round"
    filter="url(#goldGlow)"/>

  <!-- Inner gold highlight -->

  <path
    d="M181 643
       C218 375 360 224 512 224
       C664 224 806 375 843 643"
    stroke="#FFE77A"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.85"/>

  <!-- ========================= -->
  <!-- WHITE BRIDGE SUPPORTS -->
  <!-- ========================= -->

  <rect x="230" y="505"
        width="72" height="250"
        rx="22"
        fill="url(#whiteMetal)"
        filter="url(#shadow)"/>

  <rect x="722" y="505"
        width="72" height="250"
        rx="22"
        fill="url(#whiteMetal)"
        filter="url(#shadow)"/>

  <!-- Support highlights -->

  <rect x="247" y="525"
        width="16" height="205"
        rx="8"
        fill="#FFFFFF"
        opacity="0.9"/>

  <rect x="739" y="525"
        width="16" height="205"
        rx="8"
        fill="#FFFFFF"
        opacity="0.9"/>

  <!-- ========================= -->
  <!-- BLUE CONNECTION SYMBOL -->
  <!-- ========================= -->

  <path
    d="M365 600
       C410 520 455 470 512 470
       C569 470 614 520 659 600"
    stroke="#082F70"
    stroke-width="88"
    stroke-linecap="round"
    opacity="0.25"/>

  <path
    d="M365 600
       C410 520 455 470 512 470
       C569 470 614 520 659 600"
    stroke="url(#blue)"
    stroke-width="62"
    stroke-linecap="round"
    filter="url(#blueGlow)"/>

  <!-- Connection center -->

  <circle cx="512" cy="470"
          r="30"
          fill="#2388FF"/>

  <circle cx="512" cy="470"
          r="13"
          fill="#FFFFFF"
          opacity="0.9"/>

  <!-- ========================= -->
  <!-- BRIDGE DECK -->
  <!-- ========================= -->

  <rect x="175" y="700"
        width="674"
        height="86"
        rx="43"
        fill="#092F70"
        opacity="0.25"/>

  <rect x="175" y="680"
        width="674"
        height="82"
        rx="41"
        fill="url(#whiteMetal)"
        filter="url(#shadow)"/>

  <!-- Deck highlight -->

  <rect x="225" y="700"
        width="574"
        height="13"
        rx="6.5"
        fill="#FFFFFF"
        opacity="0.95"/>

  <!-- ========================= -->
  <!-- GOLD ACCENT POINTS -->
  <!-- ========================= -->

  <circle cx="150" cy="650"
          r="17"
          fill="#FFD84D"/>

  <circle cx="874" cy="650"
          r="17"
          fill="#FFD84D"/>

  <circle cx="512" cy="180"
          r="15"
          fill="#FFF3A3"/>

</svg>
