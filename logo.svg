<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D99A00"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1769D1"/>
      <stop offset="100%" stop-color="#062B6F"/>
    </linearGradient>
  </defs>

  <!-- Outer bridge arch -->
  <path
    d="M150 650
       C150 350 350 150 512 150
       C674 150 874 350 874 650"
    fill="none"
    stroke="url(#gold)"
    stroke-width="90"
    stroke-linecap="round"/>

  <!-- Bridge deck -->
  <rect
    x="120"
    y="650"
    width="784"
    height="90"
    rx="45"
    fill="#FFFFFF"/>

  <!-- Bridge supports -->
  <rect x="210" y="650" width="85" height="190" rx="25"
        fill="url(#blue)"/>

  <rect x="729" y="650" width="85" height="190" rx="25"
        fill="url(#blue)"/>

  <!-- Inner blue arch -->
  <path
    d="M285 650
       C300 430 420 320 512 320
       C604 320 724 430 739 650"
    fill="none"
    stroke="url(#blue)"
    stroke-width="55"
    stroke-linecap="round"/>

  <!-- Opportunity point -->
  <circle
    cx="512"
    cy="320"
    r="55"
    fill="url(#gold)"/>

  <circle
    cx="512"
    cy="320"
    r="25"
    fill="#FFFFFF"/>

</svg>
