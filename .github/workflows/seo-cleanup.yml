name: OpportunityBridge SEO Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Run SEO cleanup
        run: python scripts/seo_cleanup.py

      - name: Clean sitemap
        run: python scripts/clean_sitemap.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Automated SEO and sitemap cleanup"

          git push
