name: OpportunityBridge Full Automation

on:
  schedule:
    # Kila siku saa 09:00 Tanzania time (06:00 UTC)
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunitybridge-main-writer
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Discover new opportunities
        run: |
          python scripts/opportunity_discovery.py

      - name: Verify discovered opportunities
        run: |
          python scripts/opportunity_verifier.py

      - name: Approve verified opportunities
        run: |
          python scripts/opportunity_approval.py

          - name: Generate opportunity articles
        run: |
          python scripts/opportunity_article_generator.py

      - name: Fix site URLs and canonical URLs
        run: |
          python scripts/fix_site_urls.py

      - name: Update internal links
        run: |
          python scripts/auto_internal_links.py  

      - name: Generate sitemap
        run: |
          python scripts/generate_sitemap.py

      - name: Run SEO checker
        run: |
          python scripts/seo_checker.py

      - name: Show automation summary
        run: |
          echo "======================================"
          echo "OPPORTUNITYBRIDGE AUTOMATION SUMMARY"
          echo "======================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              ("Discovered", "data/discovered_opportunities.json", "total", "items"),
              ("Verified", "data/verified_opportunities.json", "total_checked", "items"),
              ("Approved", "data/approved_opportunities.json", "approved_count", "approved_items"),
          ]

          for label, filename, count_key, items_key in files:
              p = Path(filename)

              if p.exists():
                  data = json.loads(p.read_text(encoding="utf-8"))
                  count = data.get(count_key, len(data.get(items_key, [])))
                  print(f"{label}: {count}")
              else:
                  print(f"{label}: 0")

          echo = "Automation completed successfully."
          print(echo)
          PY

          echo "======================================"

      - name: Publish automation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            '*.html' \
            sitemap.xml \
            data/discovered_opportunities.json \
            data/verified_opportunities.json \
            data/approved_opportunities.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "chore: automated opportunity update [skip ci]"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
