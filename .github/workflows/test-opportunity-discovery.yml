name: OpportunityBridge Full Automation

on:
  schedule:
    # Kila siku saa 09:00 Tanzania time
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunitybridge-main-writer
  cancel-in-progress: false


jobs:

  automate:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ======================================================
      # 1. DISCOVERY
      # ======================================================

      - name: Discover new opportunities
        id: discovery
        run: |
          set -e

          python scripts/opportunity_discovery.py


      # ======================================================
      # 2. VERIFICATION
      # ======================================================

      - name: Verify discovered opportunities
        id: verification
        run: |
          set -e

          python scripts/opportunity_verifier.py


      # ======================================================
      # 3. APPROVAL
      # ======================================================

      - name: Approve verified opportunities
        id: approval
        run: |
          set -e

          python scripts/opportunity_approval.py


      # ======================================================
      # 4. ARTICLE GENERATION
      # ======================================================

      - name: Generate opportunity articles
        id: article_generation
        run: |
          set -e

          python scripts/opportunity_article_generator.py


      # ======================================================
      # 5. HOMEPAGE UPDATE
      #
      # Approved opportunities with generated article pages
      # are automatically added to index.html.
      #
      # This happens BEFORE URL repair, internal links,
      # sitemap generation and SEO validation.
      # ======================================================

      - name: Update homepage with approved opportunities
        id: homepage
        run: |
          set -e

          python scripts/update_homepage.py


      # ======================================================
      # 6. CANONICAL + URL REPAIR
      # ======================================================

      - name: Repair canonical and site URLs
        id: url_repair
        run: |
          set -e

          python scripts/fix_site_urls.py


      # ======================================================
      # 7. INTERNAL LINKS
      # ======================================================

      - name: Update internal links
        id: internal_links
        run: |
          set -e

          python scripts/auto_internal_links.py


      # ======================================================
      # 8. SITEMAP
      # ======================================================

      - name: Generate sitemap
        id: sitemap
        run: |
          set -e

          python scripts/generate_sitemap.py


      # ======================================================
      # 9. SEO VALIDATION
      #
      # IMPORTANT:
      #
      # SEO checker still runs normally.
      #
      # However, an SEO failure DOES NOT stop the workflow.
      #
      # This prevents:
      #
      # Article generated
      #        ↓
      # Homepage updated
      #        ↓
      # SEO checker failed
      #        ↓
      # Publish skipped
      #
      # SEO problems are still visible in the GitHub Actions
      # logs and can be fixed separately.
      # ======================================================

      - name: Run SEO checker
        id: seo
        continue-on-error: true
        run: |
          python scripts/seo_checker.py


      # ======================================================
      # 10. AUTOMATION SUMMARY
      # ======================================================

      - name: Show automation summary
        if: always()
        run: |
          echo "======================================"
          echo "OPPORTUNITYBRIDGE AUTOMATION SUMMARY"
          echo "======================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              (
                  "Discovered",
                  "data/discovered_opportunities.json",
                  "total",
                  "items"
              ),
              (
                  "Verified",
                  "data/verified_opportunities.json",
                  "total_checked",
                  "items"
              ),
              (
                  "Approved",
                  "data/approved_opportunities.json",
                  "approved_count",
                  "approved_items"
              ),
          ]

          for label, filename, count_key, items_key in files:

              path = Path(filename)

              if path.exists():

                  try:
                      data = json.loads(
                          path.read_text(
                              encoding="utf-8"
                          )
                      )

                      count = data.get(
                          count_key,
                          len(data.get(items_key, []))
                      )

                      print(
                          f"{label}: {count}"
                      )

                  except Exception as error:

                      print(
                          f"{label}: ERROR - {error}"
                      )

              else:

                  print(
                      f"{label}: 0"
                  )


          # ==================================================
          # CHECK HOMEPAGE
          # ==================================================

          homepage = Path("index.html")

          if homepage.exists():

              homepage_html = homepage.read_text(
                  encoding="utf-8"
              )

              start_marker = (
                  "<!-- OPPORTUNITYBRIDGE_AUTO_OPPORTUNITIES_START -->"
              )

              end_marker = (
                  "<!-- OPPORTUNITYBRIDGE_AUTO_OPPORTUNITIES_END -->"
              )

              start_count = homepage_html.count(
                  start_marker
              )

              end_count = homepage_html.count(
                  end_marker
              )

              print("")
              print("Homepage:")

              print(
                  f"  Auto section start markers: {start_count}"
              )

              print(
                  f"  Auto section end markers: {end_count}"
              )

              if (
                  start_count == 1
                  and end_count == 1
              ):

                  print(
                      "  Homepage auto-opportunity section: OK"
                  )

              else:

                  print(
                      "  Homepage auto-opportunity section: CHECK"
                  )

          else:

              print("")

              print(
                  "Homepage: index.html not found."
              )


          # ==================================================
          # CHECK SITEMAP
          # ==================================================

          sitemap = Path("sitemap.xml")

          print("")

          if sitemap.exists():

              sitemap_html = sitemap.read_text(
                  encoding="utf-8"
              )

              url_count = sitemap_html.count(
                  "<loc>"
              )

              print(
                  f"Sitemap URLs: {url_count}"
              )

          else:

              print(
                  "Sitemap: sitemap.xml not found."
              )


          # ==================================================
          # CHECK GENERATED ARTICLE FILES
          # ==================================================

          article_files = list(
              Path(".").glob("*.html")
          )

          generated_articles = []

          for article_file in article_files:

              try:

                  content = article_file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              except Exception:

                  continue

              if (
                  "OpportunityBridge" in content
                  and (
                      "OPPORTUNITYBRIDGE_GENERATED_ARTICLE"
                      in content
                      or
                      "OpportunityBridge Article"
                      in content
                  )
              ):

                  generated_articles.append(
                      article_file
                  )


          print("")

          print(
              "Generated article pages detected: "
              f"{len(generated_articles)}"
          )


          # ==================================================
          # SHOW GENERATED ARTICLES
          # ==================================================

          if generated_articles:

              print("")

              print(
                  "Generated article files:"
              )

              for article_file in sorted(
                  generated_articles
              ):

                  print(
                      f"  - {article_file}"
                  )


          # ==================================================
          # GIT STATUS
          # ==================================================

          print("")

          print(
              "Current Git status:"
          )

          import subprocess

          git_status = subprocess.run(
              [
                  "git",
                  "status",
                  "--short"
              ],
              capture_output=True,
              text=True
          )

          print(
              git_status.stdout
          )


          # ==================================================
          # FINAL PIPELINE
          # ==================================================

          print("")

          print(
              "Automation pipeline:"
          )

          print(
              "Discovery -> Verification -> Approval -> "
              "Article Generation -> Homepage Update -> "
              "URL Repair -> Internal Links -> Sitemap -> "
              "SEO Validation -> Publish"
          )


          print(
              "======================================"
          )

          PY

          echo "======================================"


      # ======================================================
      # 11. SHOW GENERATED CHANGES
      # ======================================================

      - name: Show generated changes
        if: always()
        run: |
          echo "======================================"
          echo "GENERATED FILE CHANGES"
          echo "======================================"

          git status --short

          echo "======================================"


      # ======================================================
      # 12. VERIFY CRITICAL PUBLISH PREREQUISITES
      #
      # SEO is intentionally NOT required here.
      #
      # SEO is diagnostic and must not prevent publication.
      # ======================================================

      - name: Verify publish prerequisites
        id: publish_check
        if: always()
        run: |

          echo "======================================"
          echo "CHECKING PUBLISH PREREQUISITES"
          echo "======================================"

          echo ""
          echo "Discovery:"
          echo "${{ steps.discovery.outcome }}"

          echo ""
          echo "Verification:"
          echo "${{ steps.verification.outcome }}"

          echo ""
          echo "Approval:"
          echo "${{ steps.approval.outcome }}"

          echo ""
          echo "Article generation:"
          echo "${{ steps.article_generation.outcome }}"

          echo ""
          echo "Homepage:"
          echo "${{ steps.homepage.outcome }}"

          echo ""
          echo "URL repair:"
          echo "${{ steps.url_repair.outcome }}"

          echo ""
          echo "Internal links:"
          echo "${{ steps.internal_links.outcome }}"

          echo ""
          echo "Sitemap:"
          echo "${{ steps.sitemap.outcome }}"

          echo ""
          echo "SEO:"
          echo "${{ steps.seo.outcome }}"


          # ==================================================
          # DISCOVERY
          # ==================================================

          if [
            "${{ steps.discovery.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Discovery failed."

            exit 1

          fi


          # ==================================================
          # VERIFICATION
          # ==================================================

          if [
            "${{ steps.verification.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Verification failed."

            exit 1

          fi


          # ==================================================
          # APPROVAL
          # ==================================================

          if [
            "${{ steps.approval.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Approval failed."

            exit 1

          fi


          # ==================================================
          # ARTICLE GENERATION
          # ==================================================

          if [
            "${{ steps.article_generation.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Article generation failed."

            exit 1

          fi


          # ==================================================
          # HOMEPAGE
          # ==================================================

          if [
            "${{ steps.homepage.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Homepage update failed."

            exit 1

          fi


          # ==================================================
          # URL REPAIR
          # ==================================================

          if [
            "${{ steps.url_repair.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: URL repair failed."

            exit 1

          fi


          # ==================================================
          # INTERNAL LINKS
          # ==================================================

          if [
            "${{ steps.internal_links.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Internal links update failed."

            exit 1

          fi


          # ==================================================
          # SITEMAP
          # ==================================================

          if [
            "${{ steps.sitemap.outcome }}"
            != "success"
          ]; then

            echo ""
            echo "ERROR: Sitemap generation failed."

            exit 1

          fi


          # ==================================================
          # SEO DOES NOT BLOCK PUBLISH
          # ==================================================

          echo ""
          echo "======================================"
          echo "SEO RESULT"
          echo "======================================"

          if [
            "${{ steps.seo.outcome }}"
            = "failure"
          ]; then

            echo "SEO checker reported errors."

            echo ""
            echo "IMPORTANT:"
            echo "SEO failure will NOT block publication."

            echo ""
            echo "The SEO issue should be fixed separately."

          else

            echo "SEO checker passed."

          fi


          # ==================================================
          # FINAL PREREQUISITE RESULT
          # ==================================================

          echo ""
          echo "======================================"
          echo "PUBLISH PREREQUISITES PASSED"
          echo "======================================"

          echo ""
          echo "Critical automation steps completed."

          echo ""
          echo "The workflow is allowed to continue to Publish."

          echo "======================================"


      # ======================================================
      # 13. PUBLISH
      #
      # Generated articles, index.html, sitemap.xml and
      # automation data are committed and pushed to main.
      #
      # GitHub Pages can then deploy the updated website.
      # ======================================================

      - name: Publish automation results
        if: steps.publish_check.outcome == 'success'
        run: |

          set -e


          # ==================================================
          # GIT IDENTITY
          # ==================================================

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          echo "======================================"
          echo "PREPARING AUTOMATED PUBLISH"
          echo "======================================"


          # ==================================================
          # SHOW STATUS BEFORE STAGING
          # ==================================================

          echo ""
          echo "Repository status before staging:"

          git status --short


          # ==================================================
          # ADD GENERATED WEBSITE FILES
          # ==================================================

          echo ""
          echo "Staging generated files..."


          git add -- \
            '*.html' \
            sitemap.xml \
            data/discovered_opportunities.json \
            data/verified_opportunities.json \
            data/approved_opportunities.json


          # ==================================================
          # SHOW STAGED CHANGES
          # ==================================================

          echo ""
          echo "Staged changes:"

          git status --short


          # ==================================================
          # CHECK WHETHER THERE IS SOMETHING TO PUBLISH
          # ==================================================

          if git diff --cached --quiet; then

            echo ""
            echo "No changes to publish."

            echo ""
            echo "The automation completed successfully, "
            echo "but no new repository changes were detected."

            exit 0

          fi


          # ==================================================
          # SHOW CHANGE SUMMARY
          # ==================================================

          echo ""
          echo "Changes detected."

          echo ""
          echo "Changed files:"

          git diff --cached --name-status


          # ==================================================
          # COMMIT
          # ==================================================

          echo ""
          echo "Creating automation commit..."


          git commit \
            -m "chore: automated opportunity update [skip ci]"


          # ==================================================
          # FETCH LATEST MAIN
          # ==================================================

          echo ""
          echo "Fetching latest main branch..."


          git fetch origin main


          # ==================================================
          # REBASE
          # ==================================================

          echo ""
          echo "Rebasing automation changes onto latest main..."


          git rebase origin/main


          # ==================================================
          # PUSH
          # ==================================================

          echo ""
          echo "Pushing automated changes to main..."


          git push origin HEAD:main


          # ==================================================
          # PUBLISH SUCCESS
          # ==================================================

          echo ""
          echo "======================================"
          echo "PUBLISH COMPLETED SUCCESSFULLY"
          echo "======================================"

          echo ""
          echo "Generated articles were published."

          echo ""
          echo "index.html was published."

          echo ""
          echo "sitemap.xml was published."

          echo ""
          echo "Automation data was published."

          echo ""
          echo "GitHub Pages can now deploy the changes."

          echo "======================================"


      # ======================================================
      # 14. FINAL AUTOMATION RESULT
      # ======================================================

      - name: Final automation result
        if: always()
        run: |

          echo ""
          echo "=================================================="
          echo "OPPORTUNITYBRIDGE FINAL AUTOMATION RESULT"
          echo "=================================================="


          echo ""
          echo "Critical pipeline:"
          echo "Discovery        : ${{ steps.discovery.outcome }}"
          echo "Verification     : ${{ steps.verification.outcome }}"
          echo "Approval         : ${{ steps.approval.outcome }}"
          echo "Article Generator: ${{ steps.article_generation.outcome }}"
          echo "Homepage         : ${{ steps.homepage.outcome }}"
          echo "URL Repair       : ${{ steps.url_repair.outcome }}"
          echo "Internal Links   : ${{ steps.internal_links.outcome }}"
          echo "Sitemap          : ${{ steps.sitemap.outcome }}"
          echo "SEO Checker      : ${{ steps.seo.outcome }}"
          echo "Publish Check    : ${{ steps.publish_check.outcome }}"


          echo ""
          echo "=================================================="
          echo "PUBLICATION POLICY"
          echo "=================================================="


          if [
            "${{ steps.seo.outcome }}"
            = "failure"
          ]; then

            echo "SEO checker reported errors."

            echo ""
            echo "SEO failure did NOT block publication."

            echo ""
            echo "Review the SEO logs and fix the reported issues."

          else

            echo "SEO checker passed."

          fi


          echo ""
          echo "=================================================="
          echo "WEBSITE PUBLICATION"
          echo "=================================================="


          if [
            "${{ steps.publish_check.outcome }}"
            = "success"
          ]; then

            echo "Critical pipeline completed."

            echo ""
            echo "Generated articles and index.html were"
            echo "eligible for publication."

            echo ""
            echo "If changes existed, they were pushed to main."

            echo ""
            echo "GitHub Pages will deploy the updated website."

          else

            echo "Publication was blocked because a critical"
            echo "automation stage failed."

          fi


          echo ""
          echo "=================================================="
          echo "END OF AUTOMATION"
          echo "=================================================="
