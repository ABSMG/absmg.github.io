name: SEO Pipeline Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunitybridge-seo-check
  cancel-in-progress: false

jobs:
  seo-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check internal links
        run: |
          python scripts/auto_internal_links.py

      - name: Generate sitemap for validation
        run: |
          python scripts/generate_sitemap.py

      - name: Run SEO checker
        run: |
          python scripts/seo_checker.py

      - name: Report
        run: |
          echo "SEO pipeline check completed."
          echo "The main automation workflow is the only workflow allowed to publish changes to main."
