name: Sitemap Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunitybridge-sitemap-check
  cancel-in-progress: false

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap for validation
        run: |
          python scripts/generate_sitemap.py

      - name: Check sitemap
        run: |
          git diff -- sitemap.xml

      - name: Report
        run: |
          echo "Sitemap check completed."
          echo "The main automation workflow is the only workflow allowed to publish sitemap changes."
