name: SEO Content Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunitybridge-seo-content-check
  cancel-in-progress: false

jobs:
  seo-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check internal-link updates
        run: |
          python scripts/auto_internal_links.py

      - name: Report
        run: |
          echo "SEO content check completed."
          echo "The main automation workflow is the only workflow allowed to publish changes to main."
